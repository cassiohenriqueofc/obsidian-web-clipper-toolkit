name: validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build static documentation
        run: python3 scripts/build_site.py
      - name: Validate templates, links and privacy patterns
        run: python3 scripts/validate.py
      - name: Check project scaffolds and privacy rejection
        run: python3 scripts/smoke_check.py
      - name: Check release packaging
        run: python3 scripts/package_release.py
